services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DROPIT_MODEL: ${DROPIT_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_DESCRIPTION_API_KEY: ${DEEPSEEK_DESCRIPTION_API_KEY:-}
      DEEPSEEK_DESCRIPTION_BASE_URL: ${DEEPSEEK_DESCRIPTION_BASE_URL:-https://api.deepseek.com}
      DROPIT_DESCRIPTION_MODEL: ${DROPIT_DESCRIPTION_MODEL:-deepseek-v4.1-flash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DROPIT_TEXT_EMBEDDING_MODEL: ${DROPIT_TEXT_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      DROPIT_TEXT_EMBEDDING_DIMENSIONS: ${DROPIT_TEXT_EMBEDDING_DIMENSIONS:-1024}
      DROPIT_CHROMA_DIR: ${DROPIT_CHROMA_DIR:-/app/data/chroma}
      DROPIT_INTENT_FALLBACK_ENABLED: ${DROPIT_INTENT_FALLBACK_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      DROPIT_AGENT_MEMORY_MAX_MESSAGES: ${DROPIT_AGENT_MEMORY_MAX_MESSAGES:-100}
      DROPIT_AGENT_MEMORY_TTL_SECONDS: ${DROPIT_AGENT_MEMORY_TTL_SECONDS:-1800}
      DROPIT_AGENT_CONTEXT_WINDOW_TOKENS: ${DROPIT_AGENT_CONTEXT_WINDOW_TOKENS:-32768}
      DROPIT_AGENT_CONTEXT_COMPACTION_RATIO: ${DROPIT_AGENT_CONTEXT_COMPACTION_RATIO:-0.8}
      DROPIT_AGENT_CONTEXT_KEEP_MESSAGES: ${DROPIT_AGENT_CONTEXT_KEEP_MESSAGES:-6}
      DROPIT_AGENT_CONTEXT_RESERVED_TOKENS: ${DROPIT_AGENT_CONTEXT_RESERVED_TOKENS:-4096}
      DROPIT_AGENT_CONTEXT_SUMMARY_TOKENS: ${DROPIT_AGENT_CONTEXT_SUMMARY_TOKENS:-512}
    volumes:
      - dropit_data:/app/data

volumes:
  dropit_data:
